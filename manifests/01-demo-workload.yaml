apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
    spec:
      containers:
      - name: web
        image: stefanprodan/podinfo:latest
        imagePullPolicy: IfNotPresent # <--- Add this line
        ports:
        - containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-service
spec:
  ports:
  - port: 80
    targetPort: 9898
  selector:
    app: demo-api

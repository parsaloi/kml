apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: demo-api-predictive-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: demo-api
  minReplicaCount: 2
  maxReplicaCount: 15
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
  - type: prometheus
    metadata:
      # Append :80 to explicitly define the service port
      serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
      metricName: app_predicted_qps_5m_ahead
      # Target: Maintain ~20 QPS per pod based on PREDICTED load
      threshold: '20'
      query: sum(app_predicted_qps_5m_ahead)
